# Supabase 무료 프로젝트는 1주일 동안 안 쓰면 일시정지돼요.
# 3일마다 DB에 가벼운 요청(ping)을 보내서 잠들지 않게 해요.
# GitHub는 60일 동안 활동이 없는 저장소의 예약 작업을 꺼버리므로, 한 달에 한 번 날짜 기록을 커밋해요.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # 3일마다 (UTC 03:17 = 한국 12:17)
  workflow_dispatch:          # Actions 탭에서 직접 실행도 가능

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" docs/config.js)
          KEY=$(grep -oP "key:\s*'\K[^']+" docs/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "docs/config.js 에 url/key가 없어요"; exit 1; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase 깨어 있음"

      - name: Monthly activity mark (예약 작업이 꺼지지 않게)
        run: |
          if [ "$(date -u +%d)" -le 03 ]; then
            date -u +%Y-%m-%d > .github/keepalive-last-run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive-last-run.txt
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)" || echo "변경 없음"
            git push
          fi
