<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2aa7d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="모아로그">
  <meta name="description" content="모아로그 — 친구·가족과 함께 계획하고, 기록하고, 간직하는 여행 기록장">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png">
  <title>모아로그</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="planner.css">
  <!-- 테마: id가 themeCss-○○ 인 파일 중 고른 것만 켜져요. 새 테마는 같은 방식으로 추가 -->
  <link rel="stylesheet" href="theme-glass.css" id="themeCss-glass">
  <link rel="stylesheet" href="theme-sketch.css" id="themeCss-sketch">
  <link rel="stylesheet" href="theme-passport.css" id="themeCss-passport">
  <script>
    // 저장해 둔 테마를 화면을 그리기 전에 적용 (깜빡임 방지). 고른 적 없으면 보라 글래스 (app.js 의 DEFAULT_THEME 과 같게)
    (function () {
      var t = 'glass';
      try { t = localStorage.getItem('travelTheme') || 'glass'; } catch (e) {}
      // 지금 쓰는 테마 (app.js 에서 hidden 이 아닌 것과 같게). 예전에 고른 다른 테마는 보라 글래스로
      var usable = { glass: 1 };
      if (!usable[t]) t = 'glass';
      document.documentElement.dataset.theme = t;
      var links = document.querySelectorAll('link[id^="themeCss-"]');
      for (var i = 0; i < links.length; i++) links[i].disabled = links[i].id !== 'themeCss-' + t;
      var m = document.querySelector('meta[name=theme-color]');
      var colors = { glass: '#6E5FAE', sketch: '#2aa7d9', passport: '#2f6f9f', basic: '#0f766e' };
      if (m) m.setAttribute('content', colors[t] || colors.glass);
    })();
  </script>
</head>
<body>
  <!-- 로그인 -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <h1 class="brand brand-logo"><img src="logo.svg" alt="모아로그" width="260" height="75"></h1>
      <p class="muted">함께 떠나고, 기록하고, 간직하는 우리의 기록</p>
      <div id="inviteBanner" class="invite-banner hidden"></div>
      <div class="seg" id="authTabs">
        <button type="button" data-mode="login" class="on">로그인</button>
        <button type="button" data-mode="signup">회원가입</button>
      </div>
      <form id="authForm">
        <label class="field"><span>아이디 <small class="signup-only hidden">영문·숫자·_ 3~20자</small></span><input name="userid" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60" required></label>
        <label class="field signup-only hidden"><span>이름 (친구들에게 보일 이름)</span><input name="name" maxlength="20" autocomplete="nickname"></label>
        <label class="field"><span>비밀번호</span><input name="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="primary" type="submit">로그인</button>
      </form>
      <small class="hint" id="forgotHint">비밀번호를 잊었다면 여행을 함께 쓰는 관리자에게 초기화를 부탁해 주세요.</small>
    </div>
  </div>

  <!-- 앱 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <select id="tripFilter" aria-label="여행 선택"></select>
      <button id="tripsBtn" class="top-btn" aria-label="내 여행 목록·만들기">🧳</button>
      <button id="meBtn" class="avatar" aria-label="내 정보"></button>
    </header>
    <main>
      <section id="view-map" class="view"><div id="map"></div></section>
      <!-- 타임라인: 여행 일정 관리 (planner.js — 일정·예산·준비물) -->
      <section id="view-timeline" class="view scroll hidden"><div id="planner" class="pad"></div></section>
      <!-- 기록장: 실제 방문 기록·사진·이야기 -->
      <section id="view-journal" class="view scroll hidden"><div id="journal" class="pad"></div></section>
      <section id="view-scrap" class="view scroll hidden"><div id="scrapbook" class="pad"></div></section>
    </main>
    <button id="fab" class="fab" aria-label="기록 추가"><i class="emo">＋</i><img class="gi" src="icons/add.svg" alt=""><span class="fab-label">기록 추가</span></button>
    <nav class="tabbar">
      <button data-view="map" class="on"><span><i class="emo">🗺️</i><img class="gi" src="icons/map.svg" alt=""></span>지도</button>
      <button data-view="timeline"><span><i class="emo">🕒</i><img class="gi" src="icons/timeline.svg" alt=""></span>타임라인</button>
      <button data-view="journal"><span><i class="emo">📒</i><img class="gi" src="icons/book.svg" alt=""></span>기록장</button>
      <button data-view="scrap"><span><i class="emo">📔</i><img class="gi" src="icons/scrap.svg" alt=""></span>스크랩북</button>
    </nav>
    <!-- 스크랩북 페이지 편집 (전체 화면) -->
    <div id="sbEditor" class="sb-editor hidden" role="dialog" aria-modal="true" aria-label="스크랩북 페이지 편집"></div>
    <!-- 스크랩북 스토리 보기 (전체 화면) -->
    <div id="sbStory" class="sb-story hidden" role="dialog" aria-modal="true" aria-label="스크랩북 스토리 보기" tabindex="-1"></div>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-body"></div>
  </div>
  <div id="lightbox" class="lightbox hidden"><img alt=""></div>
  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js" integrity="sha384-KRanV2NRwHPanp7iM6nlLQC5jPCTscSYMko30dLJHzNXJaUNtcucWv+SOi3jV3PE" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="planner.js"></script>
  <script src="scrapbook.js"></script>
</body>
</html>
