<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="timeline-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3FF"/><stop offset="1" stop-color="#3B5BFF"/>
    </linearGradient>
    <linearGradient id="timeline-glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="timeline-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="timeline-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="timeline-shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="timeline-clip"><circle cx="27" cy="36" r="21"/></clipPath>
    <g id="timeline-back"><rect x="28" y="6" width="30" height="30" rx="9"/></g>
  </defs>
  <g opacity=".45" transform="translate(0 5)" filter="url(#timeline-shadow)" fill="#3B7BFF"><circle cx="27" cy="36" r="21"/></g>
  <use xlink:href="#timeline-back" fill="url(#timeline-g)"/>
  <g fill="url(#timeline-g)" opacity=".38"><circle cx="27" cy="36" r="21"/></g>
  <g clip-path="url(#timeline-clip)">
    <use xlink:href="#timeline-back" fill="url(#timeline-g)" filter="url(#timeline-blur)"/>
  </g>
  <g fill="url(#timeline-glass)" stroke="url(#timeline-edge)" stroke-width=".9"><circle cx="27" cy="36" r="21"/></g>
  <path d="M27 24v12l8 5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="27" cy="36" r="2.4" fill="#fff" stroke="none"/>
