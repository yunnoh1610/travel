<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="trip-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A259FF"/><stop offset="1" stop-color="#7203FF"/>
    </linearGradient>
    <linearGradient id="trip-glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="trip-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="trip-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="trip-shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="trip-clip"><rect x="8" y="18" width="40" height="38" rx="8"/></clipPath>
    <g id="trip-back"><path d="M24 6h16a4 4 0 014 4v8h-5v-7H25v7h-5v-8a4 4 0 014-4z"/><rect x="30" y="14" width="28" height="36" rx="7"/></g>
  </defs>
  <g opacity=".45" transform="translate(0 5)" filter="url(#trip-shadow)" fill="#8C33FF"><rect x="8" y="18" width="40" height="38" rx="8"/></g>
  <use xlink:href="#trip-back" fill="url(#trip-g)"/>
  <g fill="url(#trip-g)" opacity=".38"><rect x="8" y="18" width="40" height="38" rx="8"/></g>
  <g clip-path="url(#trip-clip)">
    <use xlink:href="#trip-back" fill="url(#trip-g)" filter="url(#trip-blur)"/>
  </g>
  <g fill="url(#trip-glass)" stroke="url(#trip-edge)" stroke-width=".9"><rect x="8" y="18" width="40" height="38" rx="8"/></g>
  <path d="M20 26v22M36 26v22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
