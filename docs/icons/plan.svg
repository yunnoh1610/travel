  <g fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="27" width="22" height="20" rx="4"/><path d="M16 33h22M21 24v6M33 24v6"/></g><circle cx="22" cy="39" r="1.8" fill="#fff"/><circle cx="27" cy="39" r="1.8" fill="#fff"/><circle cx="32" cy="39" r="1.8" fill="#fff"/>
