<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="여행 기록">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>여행 기록</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- 로그인 -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand">✈️ 여행 기록</div>
      <p class="muted">함께 다녀온 곳을 지도에 남겨요</p>
      <div id="inviteBanner" class="invite-banner hidden"></div>
      <div class="seg" id="authTabs">
        <button type="button" data-mode="login" class="on">로그인</button>
        <button type="button" data-mode="signup">회원가입</button>
      </div>
      <form id="authForm">
        <label class="field"><span>아이디</span><input name="username" autocomplete="username" autocapitalize="off" required></label>
        <label class="field signup-only hidden"><span>이름 (친구들에게 보일 이름)</span><input name="name" maxlength="20" autocomplete="nickname"></label>
        <label class="field"><span>비밀번호</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">로그인</button>
      </form>
    </div>
  </div>

  <!-- 앱 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <select id="tripFilter" aria-label="여행 선택"></select>
      <button id="meBtn" class="avatar" aria-label="내 정보"></button>
    </header>
    <main>
      <section id="view-map" class="view"><div id="map"></div></section>
      <section id="view-timeline" class="view scroll hidden"><div id="timeline" class="pad"></div></section>
      <section id="view-trips" class="view scroll hidden">
        <div class="pad">
          <div class="section-head"><h2>내 여행</h2><button class="chip-btn" id="newTripBtn">＋ 새 여행</button></div>
          <div id="tripStats" class="stats"></div>
          <div id="tripList"></div>
        </div>
      </section>
    </main>
    <button id="fab" class="fab" aria-label="장소 기록하기">＋</button>
    <nav class="tabbar">
      <button data-view="map" class="on"><span>🗺️</span>지도</button>
      <button data-view="timeline"><span>🕒</span>타임라인</button>
      <button data-view="trips"><span>🧳</span>여행</button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-body"></div>
  </div>
  <div id="lightbox" class="lightbox hidden"><img alt=""></div>
  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <script src="/app.js"></script>
</body>
</html>
